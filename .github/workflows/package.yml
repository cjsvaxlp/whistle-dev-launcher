name: Build desktop packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS Apple Silicon
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cafe-tools/desktop-target
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cafe-tools/desktop-target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('desktop/Cargo.lock') }}
      - name: Test plugin
        run: npm --prefix whistle.cafe-projects test
      - name: Test desktop
        run: cargo test --locked --release --manifest-path desktop/Cargo.toml
      - name: Build DMG
        run: ./scripts/commands/打包.command --mac-only
      - uses: actions/upload-artifact@v4
        with:
          name: Cybercafe-macOS-arm64
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14

  windows-native:
    name: Windows x64 Tauri NSIS installer
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cafe-tools/windows-target
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cafe-tools/windows-target
          key: windows-cargo-${{ hashFiles('desktop/Cargo.lock') }}
          restore-keys: |
            windows-cargo-
      - uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/tauri
            ~/AppData/Local/npm-cache
            ~/AppData/Roaming/npm
          key: windows-tools-v2-${{ hashFiles('desktop/Cargo.lock', 'desktop/tauri.windows.conf.json', 'desktop/windows/installer-hooks.nsh') }}
          restore-keys: |
            windows-tools-v2-
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: x64
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Set up Rust
        run: rustup default stable
      - name: Prepare bundled Node and Whistle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --global terser @tauri-apps/cli@2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:TERSER_CLI = Join-Path (npm root -g) 'terser/bin/terser'
          python desktop/packaging/resources.py --platform windows --output .cafe-tools/windows-bundle/tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $runtime = '.cafe-tools/windows-bundle/tools/runtime'
          New-Item -ItemType Directory -Force $runtime | Out-Null
          $nodeExe = (Get-Command node.exe).Source
          $nodeDir = Split-Path $nodeExe
          Copy-Item $nodeExe "$runtime/node.exe" -Force
          npm install --prefix $runtime whistle --omit=dev
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # npm is a full package with bundled dependencies (semver etc.); copying only
          # node.exe leaves the project installer unable to run npm.
          $npmSource = Join-Path $nodeDir 'node_modules/npm'
          if (!(Test-Path (Join-Path $npmSource 'package.json'))) { throw "找不到 Node 自带的 npm：$npmSource" }
          $npmTarget = Join-Path $runtime 'node_modules/npm'
          Remove-Item $npmTarget -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item $npmSource $npmTarget -Recurse -Force
          Copy-Item (Join-Path $nodeDir 'npm.cmd') $runtime -Force
          if (Test-Path (Join-Path $nodeDir 'npx.cmd')) { Copy-Item (Join-Path $nodeDir 'npx.cmd') $runtime -Force }
          if (!(Test-Path (Join-Path $npmTarget 'node_modules/semver/package.json'))) { throw 'Node 自带的 npm 缺少 semver，无法用于项目安装。' }
      - name: Test plugin
        run: npm --prefix whistle.cafe-projects test
      - name: Test and build native EXE
        working-directory: desktop
        shell: pwsh
        run: |
          cargo test --locked --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          tauri build --config tauri.windows.conf.json --bundles nsis --ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installers = @(Get-ChildItem "$env:CARGO_TARGET_DIR/release/bundle/nsis" -Filter '*.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one NSIS EXE installer' }
          New-Item -ItemType Directory -Force ../dist | Out-Null
          $buildDate = [DateTimeOffset]::UtcNow.ToOffset([TimeSpan]::FromHours(8)).ToString('yyyy-MM-dd')
          Copy-Item -LiteralPath $installers[0].FullName -Destination "../dist/Cybercafe-$buildDate-Windows-x64-Setup.exe" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Cybercafe-Windows-x64-Setup
          path: dist/*-Windows-x64-Setup.exe
          if-no-files-found: error
          retention-days: 14
