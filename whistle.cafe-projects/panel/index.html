<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="cafe-token" content="CAFE_CSRF">
<title>Cybercafe 本地调试</title>
<link rel="stylesheet" href="./shared/toast/toast.css">
<link rel="stylesheet" href="./panel/panel.css">
<link rel="stylesheet" href="./features/terminal/embedded.css">
<link rel="stylesheet" href="./features/rules/dialog.css">
<header class="toolbar">
  <span class="brand">Cybercafe 本地调试</span>
  <div class="proxy-control">
    <label class="proxy-switch">
      <input id="local-proxy" type="checkbox" role="switch" disabled>
      <span class="proxy-switch-track" aria-hidden="true"></span>
      <span>代理总开关</span>
    </label>
    <span id="proxy-notice" class="proxy-notice" role="status"></span>
  </div>
  <fieldset class="proxy-mode-picker" id="proxy-mode-picker" role="radiogroup" aria-label="代理接入模式" aria-describedby="proxy-mode-hint" disabled>
    <label>
      <input id="browser-proxy-mode" name="proxy-mode" type="radio" value="browser" checked>
      <span>浏览器代理</span>
    </label>
    <label>
      <input id="system-proxy-mode" name="proxy-mode" type="radio" value="system">
      <span>Whistle 代理</span>
    </label>
  </fieldset>
  <span class="proxy-mode-feedback" id="proxy-mode-hint" role="status" hidden></span>
  <button class="ghost" id="doctor" type="button">体检</button>
  <button class="ghost" id="restart" type="button" title="重启 Whistle 以加载插件的最新代码">重启 Whistle</button>
  <a class="entry" id="entry" href="https://cloudgametest2.migufun.com:18443/cybercafe-power/#/amsportal" target="_blank" rel="noreferrer">打开测试入口</a>
</header>
<main class="panel">
  <div class="project-layout" id="project-page">
    <nav aria-label="项目列表">
      <input class="search" id="search" type="search" placeholder="搜索项目">
      <label class="fav-filter"><input type="checkbox" id="only-fav"> 只看收藏</label>
      <div class="list" id="projects"></div>
    </nav>
    <section class="project-card">
      <h1 id="title">选择项目</h1>
      <p class="meta" id="meta">在左侧选择项目后，可以启动本地开发服务。</p>
      <div class="actions">
        <button class="start" id="start" type="button" disabled>启动服务</button>
        <button class="secondary" id="install" type="button" hidden>安装依赖</button>
        <a class="secondary" id="open" target="_blank" rel="noreferrer" hidden>打开项目页面</a>
        <button class="secondary danger" id="stop" type="button" hidden>停止服务</button>
        <button class="secondary primary" id="restart-service" type="button" hidden>重启服务</button>
        <button class="secondary primary" id="takeover" type="button" hidden>接管并重启</button>
        <button class="secondary" id="rules" type="button">查看规则</button>
      </div>
      <p class="status" id="browser-status" role="status" hidden></p>
      <div class="startup-result" id="startup-result" hidden>
        <span id="startup-status" role="status"></span>
      </div>
      <p class="status" id="status" role="status"></p>
      <label class="game-channel" id="game-channel-field" hidden>
        渠道编码
        <input class="search" id="game-channel" type="text" maxlength="80" pattern="[A-Za-z0-9_\-]+" placeholder="输入客户端使用的 channelCode">
      </label>
      <p class="note" id="project-entry-note" hidden></p>
      <div class="inline-terminal" id="inline-terminal" hidden>
        <iframe id="terminal-frame" title="当前项目终端"></iframe>
      </div>
    </section>
  </div>
</main>
<dialog id="rule-dialog" aria-labelledby="rule-title">
  <header class="modal-head">
    <h2 id="rule-title">Cafe 自动代理</h2>
    <span class="modal-state" id="rule-state"></span>
    <button class="dialog-close" id="close-rule" type="button" aria-label="关闭规则" autofocus>×</button>
  </header>
  <pre id="rule-text">正在读取…</pre>
  <div id="rule-editor" hidden></div>
  <footer class="modal-foot">
    <button class="secondary" id="edit-rule" type="button">在 Whistle 中打开</button>
    <button class="secondary" id="preview-rule" type="button" hidden>返回规则预览</button>
    <button class="secondary" id="copy-rule" type="button">复制规则</button>
    <span class="status" id="rule-notice" role="status"></span>
  </footer>
</dialog>


<div class="modal" id="doctor-modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="doctor-title">
    <header class="modal-head">
      <span id="doctor-title">环境体检</span>
      <span class="modal-state" id="doctor-state"></span>
      <button class="dialog-close" id="close-doctor" type="button" aria-label="关闭" title="关闭">×</button>
    </header>
    <ul class="checks" id="doctor-list"></ul>
    <div class="doctor-workspace">
      <span class="sync" id="sync" role="status">正在检查同步状态…</span>
      <form class="workspace-path-form" id="workspace-path-form">
        <label for="workspace-path">或直接输入工作区路径</label>
        <div class="workspace-path-controls">
          <input class="search" id="workspace-path" type="text" placeholder="/路径/cloudgame-cybercafe/cybercafe-front" required>
          <button class="secondary" id="apply-workspace-path" type="submit">使用此路径</button>
        </div>
      </form>
      <p class="status" id="workspace-status" role="status"></p>
    </div>
    <footer class="modal-foot">
      <button class="secondary" id="save-workspace" type="button">选择目录</button>
      <button class="secondary" id="sync-now" type="button" hidden>立即同步</button>
      <button class="secondary danger" id="cleanup" type="button">清理生成文件</button>
      <button class="secondary" id="rerun-doctor" type="button">重新检查</button>
    </footer>
  </div>
</div>

<dialog class="action-dialog" id="confirm-action" aria-labelledby="confirm-title" aria-describedby="confirm-message">
  <form method="dialog">
    <header class="action-dialog-head">
      <h2 id="confirm-title">确认操作</h2>
      <button class="dialog-close" value="cancel" aria-label="取消并关闭" title="关闭" autofocus>×</button>
    </header>
    <p id="confirm-message"></p>
    <footer class="action-dialog-buttons">
      <button class="start" value="confirm">继续</button>
    </footer>
  </form>
</dialog>
<dialog class="action-dialog" id="install-prompt" aria-labelledby="install-title" aria-describedby="install-message">
  <form method="dialog">
    <header class="action-dialog-head">
      <h2 id="install-title">安装项目依赖</h2>
      <button class="dialog-close" value="cancel" aria-label="取消并关闭" title="关闭" autofocus>×</button>
    </header>
    <p id="install-message">当前项目缺少开发依赖。安装完成后会自动启动本地服务。</p>
    <footer class="action-dialog-buttons">
      <button class="start" value="install">安装并启动</button>
    </footer>
  </form>
</dialog>
<script type="module" src="./panel/app.mjs"></script>
</html>
