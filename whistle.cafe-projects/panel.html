<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="cafe-token" content="CAFE_CSRF">
<title>Cybercafe 本地调试</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; color: #1f2933; background: #fbfcfd; font: 14px/1.55 system-ui, -apple-system, "PingFang SC", sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid #e4e9ef; background: #fff; }
  .brand { font-weight: 600; font-size: 15px; }
  .sync { margin-left: auto; color: #475467; font-size: 13px; }
  .sync[data-state=warn] { color: #b45309; }
  .sync[data-state=ok] { color: #15803d; }
  .entry { padding: 5px 10px; border-radius: 6px; background: #1f6feb; color: #fff; text-decoration: none; font-size: 13px; }
  .ghost { padding: 5px 10px; border: 1px solid #d0d7de; border-radius: 6px; background: #fff; color: #475467; font: inherit; font-size: 13px; cursor: pointer; }
  .ghost:hover { border-color: #98a2b3; }
  .ghost:disabled { color: #98a2b3; cursor: wait; }
  main { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: calc(100vh - 53px); }
  nav { padding: 10px; border-right: 1px solid #e4e9ef; background: #f4f7fa; }
  nav button { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 10px; margin: 2px 0; border: 0; border-radius: 6px; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  nav button:hover { background: #e9eef4; }
  nav button[aria-current=true] { background: #dce9fb; font-weight: 600; }
  .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag { margin-left: auto; flex: none; font-size: 12px; color: #2563eb; }
  .tag.idle { color: #98a2b3; }
  section { padding: 24px 28px; }
  h1 { margin: 0 0 6px; font-size: 19px; }
  .meta { margin: 0 0 18px; color: #667085; min-height: 22px; }
  .meta b { color: #1f2933; font-weight: 600; }
  .actions { display: flex; gap: 10px; align-items: center; }
  button.start { padding: 7px 12px; border: 1px solid #1f6feb; border-radius: 6px; background: #1f6feb; color: #fff; font: inherit; cursor: pointer; }
  button.start:disabled { border-color: #d0d7de; background: #eef1f4; color: #98a2b3; cursor: not-allowed; }
  .secondary { padding: 7px 12px; border: 1px solid #d0d7de; border-radius: 6px; background: #fff; color: inherit; text-decoration: none; }
  .secondary[hidden] { display: none; }
  .status { margin-top: 16px; min-height: 22px; color: #475467; }
  .status[data-state=error] { color: #b42318; }
  .status[data-state=busy] { color: #2563eb; }
  .note { margin-top: 22px; padding: 10px 12px; border-radius: 6px; background: #f4f7fa; color: #667085; font-size: 13px; }
  .modal { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; padding: 24px; background: rgb(15 23 42 / 45%); }
  .modal[hidden] { display: none; }
  .modal-box { display: flex; flex-direction: column; width: min(820px, 100%); max-height: 82vh; border-radius: 10px; background: #fff; box-shadow: 0 24px 60px rgb(15 23 42 / 30%); overflow: hidden; }
  .modal-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid #e4e9ef; font-weight: 600; }
  .modal-state { margin-left: auto; color: #667085; font-size: 12px; font-weight: 400; }
  .modal pre { flex: 1; margin: 0; padding: 16px; overflow: auto; background: #0f172a; color: #e2e8f0; font: 12px/1.65 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; word-break: break-word; }
  .modal-foot { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-top: 1px solid #e4e9ef; }
  .empty { padding: 24px 0; color: #667085; }
</style>
<header>
  <span class="brand">Cybercafe 本地调试</span>
  <span class="sync" id="sync" role="status">正在检查同步状态…</span>
  <button class="ghost" id="restart" type="button" title="重启 Whistle 以加载插件的最新代码">重启 Whistle</button>
  <a class="entry" id="entry" href="https://cloudgametest2.migufun.com:18443/cybercafe-power/#/amsportal" target="_blank" rel="noreferrer">打开测试入口</a>
</header>
<main>
  <nav aria-label="项目文件夹" id="projects"></nav>
  <section>
    <h1 id="title">选择项目</h1>
    <p class="meta" id="meta">在左侧选择项目后，可以启动本地开发服务。</p>
    <div class="actions">
      <button class="start" id="start" type="button" disabled>启动终端</button>
      <a class="secondary" id="open" target="_blank" rel="noreferrer" hidden>打开项目页面</a>
      <button class="secondary" id="rules" type="button">查看规则</button>
    </div>
    <p class="status" id="status" role="status"></p>
    <p class="note">页面右下角的徽标会显示当前是「本地接管」还是「测试部署」。停止服务或关闭监听窗口后，刷新页面即回到测试部署。</p>
  </section>
</main>
<div class="modal" id="rule-modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="rule-title">
    <header class="modal-head">
      <span id="rule-title">Cafe 自动代理</span>
      <span class="modal-state" id="rule-state"></span>
    </header>
    <pre id="rule-text">正在读取…</pre>
    <footer class="modal-foot">
      <a class="secondary" href="http://127.0.0.1:8899/#rules" target="_blank" rel="noreferrer">在 Whistle 中打开</a>
      <button class="secondary" id="copy-rule" type="button">复制规则</button>
      <button class="start" id="close-rule" type="button">关闭</button>
    </footer>
  </div>
</div>
<script type="module" src="./panel.mjs"></script>
</html>
